# ============================================
# .github/workflows/ci.yml
# Pipeline CI — lint, tests et build du frontend et du backend
#
# CORRECTIF : le fichier precedent contenait DEUX documents YAML colles bout a
# bout (deux "name: CI", deux blocs "on:", deux jobs "frontend"/"backend").
# Les cles dupliquees rendent le workflow impossible a analyser : GitHub
# Actions refusait le fichier, donc aucune verification ne tournait.
# ============================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Annule les executions precedentes encore en cours sur la meme branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales (principe du moindre privilege)
permissions:
  contents: read

jobs:
  # ---- Frontend : lint, tests unitaires, build de production ----
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          # Aligne sur le .nvmrc du depot
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Le binaire Cypress (~200 Mo) n'est pas necessaire pour lint/test/build
      - name: Installation des dependances
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Verification des types
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build

  # ---- Backend : types, tests unitaires, build ----
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valeurs factices : les tests utilisent Supertest sans base reelle.
      # Sans elles, config/env.ts fait process.exit(1) et le job echoue.
      DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"
      ADMIN_TOKEN: "ci-token-factice-de-plus-de-32-caracteres"
      FRONTEND_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dependances
        run: npm ci

      # Le client Prisma est genere, donc absent du depot (voir .gitignore)
      - name: Generation du client Prisma
        run: npx prisma generate

      - name: Verification des types
        run: npx tsc --noEmit

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build

  # ---- Audit de securite des dependances ----
  audit:
    name: Audit des dependances
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dossier: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Echoue seulement sur les vulnerabilites hautes ou critiques
      - name: npm audit
        working-directory: ${{ matrix.dossier }}
        run: npm audit --audit-level=high