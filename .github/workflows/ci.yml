# ============================================
# CI Pipeline — Hednai
# Se declenche sur chaque push et pull request vers main
# Installe, lint, teste et build frontend + backend
# ============================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ---- Frontend ----
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ---- Backend ----
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Variables d'environnement pour les tests CI et prisma generate
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generer le client Prisma (dans .gitignore, donc absent en CI)
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
