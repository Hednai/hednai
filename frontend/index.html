<!DOCTYPE html>
<html lang="fr">
<head>

  <!-- Encodage et responsive de base -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />

  <!-- Police Google Fonts utilisee dans tout le site -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Police chargee en feuille de style normale.
       L'astuce media="print" + onload repoussait l'application de la police
       apres le premier rendu : le texte s'affichait puis changeait de fonte,
       ce qui degrade CLS dans Lighthouse. "display=swap" est deja present dans
       l'URL, il suffit a eviter le texte invisible.
       Source : web.dev/articles/font-best-practices -->
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Titre affiche dans l'onglet du navigateur -->
  <title>Hednai | Maritime Software & AI</title>

  <!-- Description pour les moteurs de recherche -->
  <meta
    name="description"
    content="Logiciels et solutions IA pour le secteur maritime. Gestion de flotte, opérations portuaires, maintenance prédictive."
  />

  <meta
    name="keywords"
    content="logiciel maritime, IA, gestion de flotte, opérations portuaires, développement web, Hednai"
  />

  <!-- URL canonique du site -->
  <link rel="canonical" href="https://hednai.com" />
  <!-- Variantes linguistiques : meme URL car la langue est geree cote client (localStorage) -->
  <!-- LIMITE : Google recommande des URLs distinctes par langue pour un vrai SEO bilingue -->
  <!-- V2 : passer a /fr/ et /en/ avec du SSR ou du pre-rendering -->
  <link rel="alternate" hreflang="fr" href="https://hednai.com" />
  <link rel="alternate" hreflang="en" href="https://hednai.com" />
  <link rel="alternate" hreflang="x-default" href="https://hednai.com" />

  <!-- Precharger l'image hero pour accelerer le LCP -->
  <!-- Source : web.dev/articles/optimize-lcp -->
  <link rel="preload" as="image" href="/hednai_bridge.webp" type="image/webp" fetchpriority="high" />

  <!-- Icone de l'onglet du navigateur.
       CORRECTIF : les anciennes references pointaient vers /logo-anchor.png,
       un fichier qui n'existe pas dans public/ (seul le .webp est present).
       Les quatre references etaient donc en 404 : plus d'icone dans l'onglet,
       et manifeste invalide donc PWA non installable.
       La balise <link rel="manifest"> est maintenant injectee automatiquement
       par vite-plugin-pwa : ne pas la remettre ici. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c2340" />

  <!-- Open Graph : previsualisation quand le lien est partage (Facebook, LinkedIn...) -->
  <meta property="og:title" content="Hednai | Maritime Software & AI" />
  <meta property="og:description" content="Logiciels et solutions IA pour le secteur maritime." />
  <meta property="og:image" content="https://hednai.com/og-image.png" />
  <meta property="og:url" content="https://hednai.com" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Hednai" />

  <!-- Twitter Card : previsualisation quand le lien est partage sur Twitter/X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Hednai | Maritime Software & AI" />
  <meta name="twitter:description" content="Logiciels et solutions IA pour le secteur maritime." />
  <meta name="twitter:image" content="https://hednai.com/og-image.png" />

  <!-- Donnees structurees pour les moteurs de recherche (fiche "Personne") -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Hednai",
    "url": "https://hednai.com",
    "sameAs": [
      "https://github.com/Hednai"
    ],
    "jobTitle": "Software Developer - Maritime & AI",
    "worksFor": {
      "@type": "Organization",
      "name": "Hednai"
    }
  }
  </script>

  <!-- Google Analytics : decommenter et remplacer G-XXXXXXX une fois l'ID pret
  <link rel="preconnect" href="https://www.googletagmanager.com" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXX');
  </script>
  -->

  <!-- Plausible Analytics : statistiques de visite anonymes, sans cookies, conforme RGPD -->
  <!-- Activer apres creation du compte sur plausible.io et ajout du domaine hednai.com -->
  <!-- <script defer data-domain="hednai.com" src="https://plausible.io/js/script.js"></script> -->

</head>

<body>

  <!-- Applique le theme AVANT le premier rendu.
       Sans ce script, data-theme n'etait pose qu'apres le montage de React :
       la page s'affichait une fraction de seconde en clair avant de basculer
       en sombre (flash + decalage visuel penalise par Lighthouse).
       Volontairement inline et synchrone : c'est le seul moyen de s'executer
       avant la peinture. Source : web.dev/articles/building-a-theme-switch -->
  <script>
    (function () {
      try {
        var sauvegarde = localStorage.getItem("hednai-theme");
        var sombre = sauvegarde
          ? sauvegarde === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", sombre ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <!-- Point d'ancrage ou React va afficher toute l'application -->
  <div id="root"></div>

  <!-- Script principal qui demarre React -->
  <script type="module" src="/src/main.tsx"></script>

</body>
</html>
