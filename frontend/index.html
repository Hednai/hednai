<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==================== SEO de base ====================
         Ces balises sont la valeur de repli servie avant l'execution du
         JavaScript : c'est ce que lisent les robots qui n'executent pas le JS.
         L'attribut data-rh="true" cede le controle a react-helmet-async :
         le composant Seo remplace ces balises au lieu de les dupliquer. -->
    <title data-rh="true">Hednai | Logiciels maritimes et IA</title>
    <meta
      data-rh="true"
      name="description"
      content="Hednai conçoit des logiciels et solutions IA pour le secteur maritime. De la mer au code."
    />
    <meta name="keywords" content="logiciel maritime, IA maritime, développement logiciel, Hednai" />
    <meta name="author" content="Hednai" />
    <meta name="robots" content="index, follow" />

    <!-- URL de reference du site. Le composant Seo la remplace par l'URL
         canonique de la route affichee des que React est monte. -->
    <link data-rh="true" rel="canonical" href="https://hednai.com/" />

    <!-- ==================== Open Graph (LinkedIn, Facebook) ==================== -->
    <meta property="og:site_name" content="Hednai" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://hednai.com/" />
    <meta data-rh="true" property="og:title" content="Hednai | Logiciels maritimes et IA" />
    <meta
      data-rh="true"
      property="og:description"
      content="Hednai conçoit des logiciels et solutions IA pour le secteur maritime."
    />
    <meta data-rh="true" property="og:image" content="https://hednai.com/og-image.png" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:locale:alternate" content="en_CA" />

    <!-- ==================== Twitter / X ==================== -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:url" content="https://hednai.com/" />
    <meta data-rh="true" name="twitter:title" content="Hednai | Logiciels maritimes et IA" />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Hednai conçoit des logiciels et solutions IA pour le secteur maritime."
    />
    <meta data-rh="true" name="twitter:image" content="https://hednai.com/og-image.png" />

    <!-- Icone de l'onglet du navigateur.
         CORRECTIF : les anciennes references pointaient vers /logo-anchor.png,
         un fichier qui n'existe pas dans public/ (seul le .webp est present).
         Les quatre references etaient donc en 404 : plus d'icone dans l'onglet,
         et manifeste invalide donc PWA non installable.
         La balise <link rel="manifest"> est maintenant injectee automatiquement
         par vite-plugin-pwa : ne pas la remettre ici. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0c2340" />

    <!-- Prechargement de l'image LCP (Largest Contentful Paint).
         L'image de fond du Hero est l'element le plus grand du premier ecran.
         Sans "preload", le navigateur ne la decouvre qu'apres avoir telecharge
         et parse le CSS : il perd plusieurs centaines de millisecondes.
         Avec "preload", le telechargement demarre en parallele du CSS.
         fetchpriority="high" dit au navigateur de prioriser cette image par
         rapport aux autres ressources (polices, icones).
         Source : web.dev/articles/optimize-lcp#optimize_when_the_resource_is_discovered -->
    <link rel="preload" as="image" href="/hednai_bridge.webp" type="image/webp" fetchpriority="high" />

    <!-- Polices auto-hebergees, importees dans src/main.tsx -->

  </head>
  <body>
    <!-- Applique le theme AVANT le premier rendu.
         Sans ce script, data-theme n'etait pose qu'apres le montage de React :
         la page s'affichait une fraction de seconde en clair avant de basculer
         en sombre (flash + decalage visuel penalise par Lighthouse).
         Volontairement inline et synchrone : c'est le seul moyen de s'executer
         avant la peinture. Source : web.dev/articles/building-a-theme-switch -->
    <script>
      (function () {
        try {
          var sauvegarde = localStorage.getItem("hednai-theme");
          var sombre = sauvegarde
            ? sauvegarde === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", sombre ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!-- Point d'ancrage ou React va afficher toute l'application -->
    <div id="root"></div>

    <!-- Script principal qui demarre React -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
